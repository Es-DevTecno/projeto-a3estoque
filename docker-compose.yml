# Sobe o sistema inteiro: docker compose up --build
# Escalar o estoque:     docker compose up --build --scale estoque-service=3
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: a3
      POSTGRES_PASSWORD: a3senha
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a3"]
      interval: 5s
      retries: 10

  # Login: usa Firebase Authentication (senhas) + Firestore (perfis).
  # Precisa do arquivo firebase/service-account.json e do .env (veja o README).
  auth-service:
    build: ./services/auth-service
    environment:
      PORT: 3001
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Crie o arquivo .env (copie do .env.example)}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:?Coloque FIREBASE_API_KEY no .env}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase.json
    volumes:
      - ./firebase/service-account.json:/run/secrets/firebase.json:ro

  estoque-service:
    build: ./services/estoque-service
    environment:
      PORT: 3002
      DATABASE_URL: postgres://a3:a3senha@postgres:5432/estoque_db
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}   # so para conferir o token
    depends_on:
      postgres: { condition: service_healthy }
    # sem "ports": assim da pra subir varias replicas sem conflito

  notificacao-worker:
    build: ./services/notificacao-worker
    environment:
      DATABASE_URL: postgres://a3:a3senha@postgres:5432/estoque_db
    depends_on:
      postgres: { condition: service_healthy }

  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - auth-service
      - estoque-service

volumes:
  pgdata:
