# API Gateway: porta unica de entrada (http://localhost:8080)
# O Docker resolve "estoque-service" para TODAS as replicas,
# e o nginx distribui as requisicoes entre elas (round-robin).
upstream auth    { server auth-service:3001; }
upstream estoque { server estoque-service:3002; }

limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

server {
  listen 80;

  location /api/auth/ {
    limit_req zone=api burst=20;
    # CORS: permite chamar a API do Postman, de file:// ou de outro front
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Expose-Headers "X-Instancia" always;
    if ($request_method = OPTIONS) { return 204; }
    proxy_pass http://auth/;
    proxy_set_header X-Request-Id $request_id;
  }

  location /api/estoque/ {
    limit_req zone=api burst=100;
    # CORS: permite chamar a API do Postman, de file:// ou de outro front
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Expose-Headers "X-Instancia" always;
    if ($request_method = OPTIONS) { return 204; }
    proxy_pass http://estoque/;
    proxy_set_header X-Request-Id $request_id;
  }

  # Front-end estatico
  location / {
    root /usr/share/nginx/html;
    index index.html;
  }
}
